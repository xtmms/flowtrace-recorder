<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>FlowTrace Recorder</title>
  <style>
    :root {
      --bg-base: #f8fafc;
      --bg-surface: #ffffff;
      --bg-hover: #f1f5f9;
      --bg-active: #e2e8f0;
      
      --border-subtle: #f1f5f9;
      --border-base: #e2e8f0;
      --border-dark: #cbd5e1;
      --border-focus: #6366f1;
      
      --text-main: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: rgba(99, 102, 241, 0.08);
      --primary-ring: rgba(99, 102, 241, 0.2);
      
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --danger-light: rgba(239, 68, 68, 0.08);
      
      --success: #10b981;
      --success-hover: #059669;
      --success-light: rgba(16, 185, 129, 0.1);
      --success-border: #a7f3d0;
      
      --warning: #f59e0b;
      --warning-light: rgba(245, 158, 11, 0.1);
      
      --shadow-xs: 0 1px 2px 0 rgba(15, 23, 42, 0.04);
      --shadow-sm: 0 1px 3px 0 rgba(15, 23, 42, 0.06), 0 1px 2px -1px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.08), 0 2px 4px -2px rgba(15, 23, 42, 0.04);
      
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 10px;
      --radius-full: 9999px;
      
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg-base);
      font-family: var(--font-sans);
      font-size: 12px;
      color: var(--text-main);
      overflow-x: hidden;
      width: 100%;
      min-width: 280px;
      -webkit-font-smoothing: antialiased;
    }

    *:focus-visible {
      outline: 2px solid var(--border-focus);
      outline-offset: 1px;
    }

    #flowtrace-sidepanel {
      width: 100%;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header */
    #flowtrace-header {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-base);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
    }

    .flowtrace-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      text-align: left;
      user-select: none;
    }

    .flowtrace-brand-icon {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 2px 4px rgba(79, 70, 229, 0.25));
    }

    .flowtrace-brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }

    .flowtrace-brand-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: var(--text-main);
    }

    .flowtrace-brand-badge {
      font-size: 8.5px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--primary);
      letter-spacing: 0.5px;
    }

    .flowtrace-header-right {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    #status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: var(--radius-full);
      font-size: 9.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin: 0;
      border: 1px solid var(--border-base);
      background: var(--bg-hover);
      color: var(--text-secondary);
      box-shadow: var(--shadow-xs);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
    }

    #status::before {
      content: "";
      display: inline-block;
      width: 5.5px;
      height: 5.5px;
      border-radius: 50%;
      background: currentColor;
    }

    @keyframes statusPulse {
      0% { transform: scale(0.85); opacity: 0.5; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.85); opacity: 0.5; }
    }

    #status.status-recording {
      color: var(--success) !important;
      background: var(--success-light) !important;
      border-color: var(--success-border) !important;
    }

    #status.status-recording::before {
      box-shadow: 0 0 6px currentColor;
      animation: statusPulse 1.6s infinite ease-in-out;
    }

    #status.status-stopped {
      color: #e11d48 !important;
      background: #fff1f2 !important;
      border-color: #fecdd3 !important;
    }

    #status.status-edit {
      color: #d97706 !important;
      background: #fffbeb !important;
      border-color: #fde68a !important;
    }

    #status.status-edit::before {
      box-shadow: 0 0 6px currentColor;
      animation: statusPulse 1.6s infinite ease-in-out;
    }

    #flowtrace-header button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border: 1px solid transparent;
      background: transparent;
      padding: 0;
      cursor: pointer;
      border-radius: var(--radius-sm);
      transition: all 0.15s ease;
      color: var(--text-secondary);
    }

    #flowtrace-header button:hover {
      background: var(--bg-hover);
      border-color: var(--border-base);
    }

    #flowtrace-header button:active {
      transform: scale(0.92);
    }

    #flowtrace-header button img {
      width: 15px;
      height: 15px;
      pointer-events: none;
      display: block;
    }

    /* Content Area */
    .flowtrace-content {
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Main Card */
    .main-actions {
      background: var(--bg-surface);
      border: 1px solid var(--border-base);
      border-radius: var(--radius-lg);
      padding: 10px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Test Name Input Container */
    #testNameContainer {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      background: var(--bg-base);
      border: 1px solid var(--border-base);
      border-radius: var(--radius-md);
      padding: 3px 6px 3px 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-sizing: border-box;
    }

    #testNameContainer:focus-within {
      background: var(--bg-surface);
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--primary-ring);
    }

    .test-name-icon {
      color: var(--text-muted);
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }

    #testNameInput {
      flex: 1;
      width: 0;
      min-width: 0;
      padding: 4px 2px;
      border: none;
      font-family: var(--font-sans);
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-main);
      background: transparent;
      outline: none;
    }

    #testNameInput::placeholder {
      color: var(--text-muted);
      font-weight: 400;
    }

    #btnClearTestName {
      width: 20px;
      height: 20px;
      min-width: 20px;
      padding: 0;
      border: none;
      background: transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      color: var(--text-muted);
    }

    #btnClearTestName:hover {
      background: var(--danger-light);
      color: var(--danger);
    }

    #btnClearTestName span {
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
    }

    /* Action Buttons Row */
    .action-buttons-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      width: 100%;
    }

    /* Buttons Base */
    .flowtrace-content button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 1 1 0;
      min-width: 28px;
      max-width: 36px;
      height: 33px;
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      border: 1px solid var(--border-base);
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: var(--shadow-xs);
      margin: 0;
      padding: 0;
      cursor: pointer;
      position: relative;
    }

    .flowtrace-content button:hover:not(:disabled) {
      border-color: var(--border-dark);
      background: var(--bg-hover);
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }

    .flowtrace-content button:active:not(:disabled) {
      transform: translateY(0) scale(0.95);
    }

    .flowtrace-content button:disabled {
      opacity: 0.38;
      cursor: not-allowed;
      background: var(--bg-hover);
      border-color: var(--border-base);
      box-shadow: none;
      transform: none;
    }

    .flowtrace-content button img {
      width: 17px;
      height: 17px;
      display: block;
      pointer-events: none;
    }

    /* Hero Start/Stop Micro-interactions */
    #btnStart:not(:disabled):hover {
      border-color: #fca5a5;
      background: #fff1f2;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.12);
    }

    #btnStop:not(:disabled) {
      border-color: #cbd5e1;
      background: #ffffff;
      animation: stopAttention 2s infinite ease-in-out;
    }

    #btnStop:not(:disabled):hover {
      border-color: var(--text-main);
      background: var(--bg-hover);
      box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.1);
    }

    @keyframes stopAttention {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.3); }
      70% { box-shadow: 0 0 0 4px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    /* Active assertion / comment toggle state */
    .flowtrace-content button.active {
      border-color: var(--success) !important;
      background: var(--success-light) !important;
      box-shadow: 0 0 0 2.5px rgba(16, 185, 129, 0.25) !important;
      transform: scale(0.98);
    }

    /* Target Banner */
    #assertionTargetBanner {
      display: none;
      margin: 4px 0 0 0;
      padding: 6px 10px;
      font-size: 10px;
      font-family: var(--font-mono);
      line-height: 1.4;
      border-radius: var(--radius-sm);
      background: var(--bg-hover);
      color: var(--text-secondary);
      border: 1px solid var(--border-dark);
      border-left: 3px solid var(--primary);
      text-align: left;
      word-break: break-all;
      box-shadow: var(--shadow-xs);
    }

    /* Interactive popdown input containers */
    #assertionTextContainer,
    #commentContainer {
      display: none;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      padding: 4px 6px;
      border: 1.5px solid var(--primary);
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      box-shadow: 0 4px 12px -2px rgba(79, 70, 229, 0.15);
      animation: slideDown 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #assertionTextInput,
    #commentInput {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-family: var(--font-sans);
      font-size: 11.5px;
      font-weight: 500;
      padding: 4px 6px;
      color: var(--text-main);
    }

    #assertionTextInput::placeholder,
    #commentInput::placeholder {
      color: var(--text-muted);
    }

    #assertionTextContainer button,
    #commentContainer button {
      width: 26px;
      height: 26px;
      min-width: 26px;
      border-radius: var(--radius-sm);
      background: var(--primary);
      border: none;
      box-shadow: 0 1px 2px rgba(79, 70, 229, 0.3);
      flex-shrink: 0;
      cursor: pointer;
    }

    #assertionTextContainer button:hover,
    #commentContainer button:hover {
      background: var(--primary-hover);
    }

    #assertionTextContainer img,
    #commentContainer img {
      width: 14px;
      height: 14px;
    }

    /* Logs & Console Section */
    #toggleLogs {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border-base);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: var(--shadow-xs);
      user-select: none;
    }

    #toggleLogs:hover {
      background: var(--bg-hover);
      border-color: var(--border-dark);
    }

    .toggle-logs-title {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 600;
      font-size: 11.5px;
      color: var(--text-main);
    }

    #logsCounter {
      background: var(--primary);
      color: #ffffff !important;
      font-size: 9.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: var(--radius-full);
      box-shadow: 0 1px 2px rgba(79, 70, 229, 0.3);
    }

    #arrowLogs {
      color: var(--text-muted);
      font-size: 9px;
      transition: transform 0.2s ease;
    }

    #logsSection {
      text-align: center;
      padding: 2px 0 0 0;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    #logActions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      margin-bottom: 6px;
    }

    #logActions button {
      width: 26px;
      height: 26px;
      min-width: 26px;
      border-radius: var(--radius-sm);
    }

    .small-icon {
      width: 14px !important;
      height: 14px !important;
    }

    /* Terminal Console */
    #logDisplay {
      display: block;
      width: 100%;
      height: 115px;
      padding: 10px 12px;
      box-sizing: border-box;
      outline: none !important;
      font-family: var(--font-mono) !important;
      font-size: 10.5px !important;
      line-height: 1.5;
      border: 1px solid #1e293b;
      border-radius: var(--radius-md);
      background: #090d16;
      color: #cbd5e1;
      resize: vertical;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4) !important;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    #logDisplay::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    #logDisplay::-webkit-scrollbar-track {
      background: #090d16;
      border-radius: 4px;
    }

    #logDisplay::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }

    #logDisplay::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    #logDisplay.edit-mode {
      background: #1e1b4b !important;
      color: #fef08a !important;
      border-color: #f59e0b !important;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.25), inset 0 2px 4px rgba(0, 0, 0, 0.3) !important;
    }

    /* Bottom Row Action Buttons */
    .log-buttons-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
      margin-bottom: 2px;
      width: 100%;
    }

    .log-buttons-row button {
      width: 36px !important;
      height: 36px !important;
      min-width: 36px !important;
      border-radius: var(--radius-md) !important;
    }

    .log-buttons-row img {
      width: 18px !important;
      height: 18px !important;
    }

    #btnClear:hover:not(:disabled) {
      border-color: #fca5a5 !important;
      background: #fff1f2 !important;
    }

    #btnDownload:hover:not(:disabled),
    #btnUpload:hover:not(:disabled) {
      border-color: #a5b4fc !important;
      background: #eef2ff !important;
    }

    #btnEdit:hover:not(:disabled) {
      border-color: #fde68a !important;
      background: #fffbeb !important;
    }

    /* Loading Overlay */
    #flowtrace-loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 999999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    #flowtrace-loading-overlay.active {
      display: flex;
    }

    #flowtrace-loading-overlay .flowtrace-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e2e8f0;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: nadaSpin 0.75s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
    }

    #flowtrace-loading-overlay .flowtrace-loading-text {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: -0.1px;
    }

    @keyframes nadaSpin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script src="jszip.min.js" defer></script>
  <script src="storage-delta.js" defer></script>
  <script src="sidepanel-parser.js" defer></script>
  <script src="sidepanel-report.js" defer></script>
  <script src="sidepanel.js" defer></script>
</head>
<body>
  <div id="flowtrace-sidepanel">
    <div id="flowtrace-header">
      <div class="flowtrace-brand">
        <div class="flowtrace-brand-icon">
          <svg width="26" height="26" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="26" height="26" rx="7" fill="url(#brandGrad)"/>
            <circle cx="13" cy="13" r="5.5" fill="#ffffff" fill-opacity="0.95"/>
            <circle cx="13" cy="13" r="3" fill="#ef4444"/>
            <defs>
              <linearGradient id="brandGrad" x1="0" y1="0" x2="26" y2="26" gradientUnits="userSpaceOnUse">
                <stop stop-color="#6366f1"/>
                <stop offset="1" stop-color="#4338ca"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="flowtrace-brand-text">
          <span class="flowtrace-brand-title">FlowTrace</span>
          <span class="flowtrace-brand-badge">Native Recorder</span>
        </div>
      </div>
      <div class="flowtrace-header-right">
        <div id="status">Checking...</div>
        <button id="btnReset" title="Reset completo">
          <img id="imgReset">
        </button>
        <button id="btnDetach" title="Stacca in finestra separata" style="display: none;">
          <img id="imgDetach">
        </button>
        <button id="btnAttach" title="Riattacca a Chrome" style="display: none;">
          <img id="imgAttach">
        </button>
      </div>
    </div>
    
    <div class="flowtrace-content">
      <div class="main-actions">
        <div id="testNameContainer">
          <span class="test-name-icon">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
          </span>
          <input 
            id="testNameInput" 
            type="text" 
            placeholder="Nome del Test..." 
            spellcheck="false"
            autocomplete="off"
          />
          <button id="btnClearTestName" title="Cancella nome test">
            <span>✕</span>
          </button>
        </div>
        
        <div class="action-buttons-row">
          <button id="btnStart" title="Start recording"><img id="imgRec"></button>
          <button id="btnStop" disabled title="Stop recording"><img id="imgStop"></button>
          <button id="btnAssertionText" disabled title="Assertion: text"><img id="imgAssertionText"></button>
          <button id="btnAssertionVisible" disabled title="Assertion: visible"><img id="imgAssertionVisible"></button>
          <button id="btnAssertionEnabled" disabled title="Assertion: enabled"><img id="imgAssertionEnabled"></button>
          <button id="btnAssertionDisabled" disabled title="Assertion: disabled"><img id="imgAssertionDisabled"></button>
          <button id="btnAssertionColor" disabled title="Assertion: color"><img id="imgAssertionColor"></button>
          <button id="btnAddComment" disabled title="Add Comment"><img id="imgAddComment"></button> 
        </div>

        <div id="assertionTargetBanner"></div>
        
        <div id="assertionTextContainer">      
          <input 
            id="assertionTextInput" 
            type="text" 
            placeholder="Valore atteso da verificare..." 
            spellcheck="false"
          />
          <button id="btnAssertionSend" title="Invia asserzione (Invio)">
            <img id="imgAssertionSend">
          </button>
        </div>
        
        <div id="commentContainer">
          <input 
            id="commentInput" 
            type="text" 
            placeholder="Scrivi una nota o commento..." 
            spellcheck="false"
          />
          <button id="btnCommentSend" title="Invia commento (Invio)">
            <img id="imgCommentSend">
          </button>
        </div>
      </div>

      <div id="toggleLogs">
        <div class="toggle-logs-title">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #64748b;">
            <polyline points="4 17 10 11 4 5"></polyline>
            <line x1="12" y1="19" x2="20" y2="19"></line>
          </svg>
          <span>Interazioni</span>
          <span id="logsCounter">0</span>
        </div>
        <span id="arrowLogs" title="Espandi/Comprimi">&#9660;</span>    
      </div>

      <div id="logsSection" style="display:none;">    
        <div id="logActions">
          <button id="btnUndo" title="Undo"><img id="imgUndo" class="small-icon"></button>
          <button id="btnRedo" title="Redo"><img id="imgRedo" class="small-icon"></button>
        </div>
        <textarea id="logDisplay" readonly placeholder="Waiting for actions..." spellcheck="false"></textarea>
        <div class="log-buttons-row">
          <button id="btnDownload" title="Scarica Archivio ZIP (JSON + Report HTML)"><img id="imgDownload"></button>
          <button id="btnClear" title="Clear Logs"><img id="imgClear"></button>
          <button id="btnUpload" title="Carica Archivio ZIP o JSON"><img id="imgUpload"></button>    
          <button id="btnEdit" title="Edit Logs"><img id="imgEdit"></button>  
        </div>
        <input type="file" id="uploadInput" accept=".zip,application/json" style="display:none;">
      </div>
    </div>
  </div>

  <div id="flowtrace-loading-overlay">
    <div class="flowtrace-spinner"></div>
    <div class="flowtrace-loading-text" id="flowtrace-loading-text">Generazione ZIP in corso...</div>
  </div>
</body>
</html>
